<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/srch_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var html = document.documentElement;
        var storedTheme = null;

        try {
          storedTheme = window.localStorage.getItem("srch-theme");
        } catch (_) {
          storedTheme = null;
        }

        var prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme =
          storedTheme === "light" || storedTheme === "dark"
            ? storedTheme
            : prefersDark
              ? "dark"
              : "light";

        html.setAttribute("data-theme", theme);
        html.style.colorScheme = theme;
        html.style.backgroundColor = theme === "dark" ? "#141414" : "#fafafa";
      })();
    </script>
    <script>
      (function () {
        var html = document.documentElement;
        var isWide = window.innerWidth - 322 - 300 >= 410;

        html.dataset.layoutMode = isWide ? "wide" : "overlay";

        if (isWide) {
          html.classList.add("left-open");
        } else {
          html.classList.remove("left-open");
        }

        html.classList.remove("right-open");
      })();
    </script>
    <title>SRC Handbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <!-- Preload common assets for faster homepage paint -->
    <link rel="preload" href="/src/assets/srch_logo.svg" as="image" />
    <link rel="preload" href="/src/assets/srch_logo_white.svg" as="image" />
    <!-- Backgrounds: keep prefetch to avoid competing with critical render -->
    <link
      rel="prefetch"
      href="/src/assets/landing-page-background-gradient.png"
      as="image"
    />
    <link
      rel="prefetch"
      href="/src/assets/landing_page_background_gradient_dark.png"
      as="image"
    />
    <!-- Prefetch precomputed data files for faster loads -->
    <link rel="prefetch" href="/markdown-data.json" as="fetch" />
    <link rel="prefetch" href="/search-index.json" as="fetch" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
